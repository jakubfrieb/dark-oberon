# Lobby UI: Traefik → https://oberon.cloud.digitalmind.cz (HTTP/S on port 8080 inside the network).
# Game TCP: clients connect to oberon-game.cloud.digitalmind.cz:<port> (17000–17009).
# Point the A record at the same server IP as the lobby; Traefik does not proxy these ports (custom protocol).
#
# Stable project name = same labels/Traefik whether compose lives in /server or in repo/server/.
# (Without `name`, Compose would take the parent folder name → a different project than before from the repo root → orphan / duplicate containers.)
name: dark-oberon

services:
  lobby:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "17000-17009:17000-17009/tcp"
    volumes:
      - ../maps:/app/maps:ro
    environment:
      - PORT_RANGE_START=17000
      - PORT_RANGE_END=17009
      - DATA_DIR=/app
      - WEB_PORT=8080
      - GAME_PUBLIC_HOST=oberon-game.cloud.digitalmind.cz
      # Public domain = scanners; the access log in the container is just noise (Traefik has its own logs).
      - GUNICORN_ACCESS_LOG=/dev/null
    networks:
      - public_proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=public_proxy
      - traefik.http.services.darkoberon-lobby.loadbalancer.server.port=8080
      - traefik.http.routers.darkoberon-lobby.rule=Host(`oberon.cloud.digitalmind.cz`)
      - traefik.http.routers.darkoberon-lobby.entrypoints=websecure
      - traefik.http.routers.darkoberon-lobby.tls=true
      - traefik.http.routers.darkoberon-lobby.tls.certresolver=lets-encr
      - traefik.http.routers.darkoberon-lobby.service=darkoberon-lobby

networks:
  public_proxy:
    external: true
