# Dark Oberon lobby (Flask web UI) + headless game server instances in one container.
# Web UI:   http://<host>:${WEB_HOST_PORT}   (default 8080)
# Game TCP: clients connect to ${GAME_PUBLIC_HOST}:<port> in PORT_RANGE_START..PORT_RANGE_END (custom protocol).
#
# Settings come from server/.env (copy .env.example → .env; .env is gitignored). Every variable has a default,
# so the stack also starts without .env.
#
# Deployment-specific settings (reverse proxy labels, external networks, hostnames) do not belong here:
# put them into server/docker-compose.override.yml (gitignored). `up-server` picks it up automatically.
#
# Stable project name: without `name`, Compose would take the parent folder name.
name: ${COMPOSE_PROJECT_NAME:-dark-oberon}

services:
  lobby:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${WEB_HOST_PORT:-8080}:${WEB_PORT:-8080}/tcp"
      - "${PORT_RANGE_START:-17000}-${PORT_RANGE_END:-17009}:${PORT_RANGE_START:-17000}-${PORT_RANGE_END:-17009}/tcp"
    volumes:
      - ../maps:/app/maps:ro
      # Lobby accounts (SQLite) and the generated session key; survives rebuilds.
      - lobby-data:/app/lobby-data
    environment:
      - PORT_RANGE_START=${PORT_RANGE_START:-17000}
      - PORT_RANGE_END=${PORT_RANGE_END:-17009}
      - DATA_DIR=/app
      - WEB_PORT=${WEB_PORT:-8080}
      # Empty = the lobby does not print a connect address.
      - GAME_PUBLIC_HOST=${GAME_PUBLIC_HOST:-}
      # `-` = access log to stdout, `/dev/null` = quiet.
      - GUNICORN_ACCESS_LOG=${GUNICORN_ACCESS_LOG:--}
      - LOBBY_DATA_DIR=/app/lobby-data
      # Empty = generated once and stored in the lobby-data volume.
      - LOBBY_SECRET_KEY=${LOBBY_SECRET_KEY:-}
      # Number of reverse proxies in front of the lobby (for client IPs); 0 = direct.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-0}
      # 1 = session cookie only over HTTPS (set when the lobby is served via HTTPS).
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      - LOBBY_IDLE_MINUTES=${LOBBY_IDLE_MINUTES:-30}
      - LOBBY_MAX_GAME_HOURS=${LOBBY_MAX_GAME_HOURS:-8}

volumes:
  lobby-data:
